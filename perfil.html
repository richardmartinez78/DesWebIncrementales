<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="css/styles.css">
    <title>Domótica Hogar | Mi Perfil</title>
</head>

<body class="d-flex flex-column min-vh-100" data-page="perfil">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <span class="brand-mark">DH</span> Domótica Hogar
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" data-page="inicio" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-page="catalogo" href="catalogo.html">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-page="producto" href="producto.html">Producto</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-page="carrito" href="carrito.html">Carrito</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-page="perfil" href="perfil.html">Mi perfil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-page="admin" href="admin.html">Administración</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                    <a href="carrito.html" class="btn text-white position-relative rounded-circle p-2 d-inline-flex align-items-center justify-content-center shadow-sm" title="Carrito de compras" style="width: 42px; height: 42px; background-color: #146c43; border-color: #146c43;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-cart3" viewBox="0 0 16 16">
                            <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 4H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 13H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
                        </svg>
                        <span id="cant-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                    </a>

                    <div id="nav-auth-container" class="d-flex align-items-center gap-2">
                        <a href="perfil.html" class="btn btn-outline-light btn-sm rounded-pill px-3">Ingresar</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container py-5 flex-grow-1 d-flex justify-content-center align-items-center">
        <div id="auth-forms-container" class="w-100" style="max-width: 480px;">
            <div class="card border-0 shadow-sm p-4">
                
                <!-- Pestañas para seleccionar Formulario -->
                <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active rounded-pill fw-semibold" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab" aria-controls="pills-login" aria-selected="true">
                            Iniciar Sesión
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link rounded-pill fw-semibold" id="pills-registro-tab" data-bs-toggle="pill" data-bs-target="#pills-registro" type="button" role="tab" aria-controls="pills-registro" aria-selected="false">
                            Registrarse
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="pills-tabContent">
                    
                    <!-- Formulario 1: Iniciar Sesión -->
                    <div class="tab-pane fade show active" id="pills-login" role="tabpanel" aria-labelledby="pills-login-tab" tabindex="0">
                        <form id="form-login">
                            <div class="mb-3">
                                <label for="login-email" class="form-label small fw-bold text-secondary">Correo electrónico</label>
                                <input type="email" class="form-control" id="login-email" required placeholder="correo@ejemplo.com">
                            </div>
                            <div class="mb-3">
                                <label for="login-password" class="form-label small fw-bold text-secondary">Contraseña</label>
                                <input type="password" class="form-control" id="login-password" required placeholder="••••••••">
                            </div>
                            <button type="submit" class="btn btn-success w-100 rounded-pill mt-2 shadow-sm" style="background-color: #146c43; border-color: #146c43;">
                                Ingresar
                            </button>
                        </form>
                    </div>

                    <!-- Formulario 2: Registrarse -->
                    <div class="tab-pane fade" id="pills-registro" role="tabpanel" aria-labelledby="pills-registro-tab" tabindex="0">
                        <form id="form-registro">
                            <div class="mb-3">
                                <label for="registro-nombre" class="form-label small fw-bold text-secondary">Nombre completo</label>
                                <input type="text" class="form-control" id="registro-nombre" required placeholder="Juan Pérez">
                            </div>
                            <div class="mb-3">
                                <label for="registro-email" class="form-label small fw-bold text-secondary">Correo electrónico</label>
                                <input type="email" class="form-control" id="registro-email" required placeholder="correo@ejemplo.com">
                            </div>
                            <div class="mb-3">
                                <label for="registro-password" class="form-label small fw-bold text-secondary">Contraseña</label>
                                <input type="password" class="form-control" id="registro-password" required minlength="6" placeholder="Mínimo 6 caracteres">
                            </div>
                            <div class="mb-3">
                                <label for="registro-confirm" class="form-label small fw-bold text-secondary">Confirmar contraseña</label>
                                <input type="password" class="form-control" id="registro-confirm" required minlength="6" placeholder="Repite tu contraseña">
                            </div>
                            <button type="submit" class="btn btn-success w-100 rounded-pill mt-2 shadow-sm" style="background-color: #146c43; border-color: #146c43;">
                                Crear Cuenta
                            </button>
                        </form>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer py-4 mt-auto">
        <div class="container d-flex justify-content-between flex-wrap gap-2 text-center text-md-start">
            <span>© 2026 Domótica Hogar · Sprint 3</span>
            <span>Richard Martínez</span> 
            <span>Uso de imágenes solo con fines educativos.</span>
        </div>
    </footer>

    <!-- Toast container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="appToast" class="toast">
            <div class="toast-header">
                <strong class="me-auto">Domótica Hogar</strong>
                <button class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/base.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>

</html>
