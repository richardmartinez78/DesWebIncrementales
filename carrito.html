<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Domótica Hogar | Carrito de Compras</title>
</head>

<body class="d-flex flex-column min-vh-100" data-page="carrito">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <span class="brand-mark">DH</span> Domótica Hogar
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="producto.html">Producto</a></li>
                    <li class="nav-item"><a class="nav-link active" href="carrito.html">Carrito</a></li>
                    <li class="nav-item"><a class="nav-link" href="perfil.html">Mi perfil</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html">Administración</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="flex-grow-1">
        <section class="container py-5">
            <h1 class="fw-bold mb-4">Tu Carrito de Compras</h1>

            <div class="row g-4">
                <!-- Listado de Productos -->
                <div class="col-lg-8">
                    <div id="contenedor-carrito"></div>
                </div>

                <!-- Resumen de Compra -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm p-4 rounded-3 bg-white">
                        <h2 class="h5 fw-bold mb-3">Resumen del pedido</h2>
                        <hr>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-secondary">Subtotal</span>
                            <span id="resumen-subtotal" class="fw-semibold">$ 0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-secondary">Envío</span>
                            <span class="text-success fw-semibold">Gratis</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between fs-5 fw-bold mb-4">
                            <span>Total</span>
                            <span id="resumen-total" class="text-dark">$ 0</span>
                        </div>
                        <button id="btn-confirmar" class="btn w-100 text-white py-2 rounded-pill shadow-sm" style="background-color: #146c43;">
                            Confirmar compra
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer py-4 mt-auto">
        <div class="container d-flex justify-content-between flex-wrap gap-2">
            <span>© 2026 Domótica Hogar · Proyecto integrador</span>
            <span>Uso educativo</span>
        </div>
    </footer>

    <!-- Toast de Notificación -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="appToast" class="toast align-items-center text-bg-dark border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/carrito-state.js"></script>
    <script src="js/carritoView.js"></script>
</body>

</html>
