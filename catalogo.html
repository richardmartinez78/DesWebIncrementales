<!doctype html>
<html lang='es'>

<head>
    <meta charset="utf-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Domótica Hogar | Catálogo</title>
</head>

<body class='d-flex flex-column min-vh-100' data-page='catalogo'>

    <!-- Navbar original de Nexo Store -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><span class="brand-mark">DH</span> Domótica Hogar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" data-page="inicio" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" data-page="catalogo" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="producto" href="producto.html">Producto</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="carrito" href="carrito.html">Carrito</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="perfil" href="perfil.html">Mi perfil</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="admin" href="admin.html">Administración</a></li>
                </ul>
                <button class="btn btn-outline-light btn-sm" id="btnLoginPlaceholder">Ingresar</button>
            </div>
        </div>
    </nav>

    <!-- Contenido principal con el catálogo -->
    <main class='flex-grow-1'>
        <div class="container py-5">
            <div class="section-heading mb-4">
                <h1 class="fw-bold">Catálogo de Productos</h1>
                <p class="text-secondary">Explora nuestros dispositivos de domótica para automatizar tu hogar.</p>
            </div>

            <!-- Contenedor donde se cargarán dinámicamente las tarjetas mediante JS -->
            <div id="contenedor-catalogo" class="row g-4"></div>
        </div>
    </main>

    <!-- Footer original -->
    <footer class="footer py-4 mt-auto">
        <div class="container d-flex justify-content-between flex-wrap gap-2">
            <span>© 2026 Nexo Store · Proyecto integrador</span>
            <span>Versión inicial para estudiantes</span>
        </div>
    </footer>

    <!-- Contenedor para notificaciones Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="appToast" class="toast">
            <div class="toast-header">
                <strong class="me-auto">Nexo Store</strong>
                <button class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <!-- Scripts Javascript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/base.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/catalogo.js"></script>
