<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Domótica Hogar | Catálogo</title>
</head>

<body class="d-flex flex-column min-vh-100" data-page="catalogo">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><span class="brand-mark">DH</span> Domótica Hogar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" data-page="inicio" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" data-page="catalogo" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="producto" href="producto.html">Producto</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="carrito" href="carrito.html">Carrito</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="perfil" href="perfil.html">Mi perfil</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="admin" href="admin.html">Administración</a></li>
                </ul>
                <button class="btn btn-outline-light btn-sm" id="btnLoginPlaceholder">Ingresar</button>
            </div>
        </div>
    </nav>

    <!-- Sección Principal del Catálogo -->
    <main class="flex-grow-1">
        <section class="container py-5">
            <div class="section-heading mb-4">
                <h1 class="fw-bold">Catálogo de Productos</h1>
                <p class="text-secondary">Explora nuestros dispositivos inteligentes para automatizar tu hogar.</p>
            </div>

            <!-- Panel de Búsqueda y Filtros -->
            <div class="card border-0 shadow-sm p-3 mb-4 bg-white rounded-3">
                <div class="row g-3 align-items-center">
                    <!-- Buscador por Texto -->
                    <div class="col-md-5">
                        <label for="input-busqueda" class="form-label small fw-semibold text-secondary mb-1">Buscar producto</label>
                        <input type="search" id="input-busqueda" class="form-control" placeholder="Ej: Cámara, Alexa, Lámpara...">
                    </div>

                    <!-- Filtro por Categoría -->
                    <div class="col-md-4">
                        <label for="select-categoria" class="form-label small fw-semibold text-secondary mb-1">Categoría</label>
                        <select id="select-categoria" class="form-select">
                            <option value="todas">Todas las categorías</option>
                        </select>
                    </div>

                    <!-- Botón Limpiar -->
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="button" id="btn-limpiar" class="btn btn-outline-secondary w-100">
                            Limpiar filtros
                        </button>
                    </div>
                </div>
            </div>

            <!-- Contenedor dinámico de productos -->
            <div id="contenedor-catalogo" class="row g-4"></div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer py-4 mt-auto">
        <div class="container d-flex justify-content-between flex-wrap gap-2">
            <span>© 2026 Domótica Hogar · Proyecto integrador</span>
            <span>Versión inicial para estudiantes</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/base.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/catalogo.js"></script>
</body>

</html>
